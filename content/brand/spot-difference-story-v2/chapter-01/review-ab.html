<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一章 A/B 对照</title><style>body{margin:24px;background:#eef3fb;color:#243047;font:16px system-ui}main{max-width:1200px;margin:auto}select,button{font:inherit;border:0;border-radius:12px;padding:12px;margin:4px;background:white;color:#243047}button[aria-pressed=true]{background:#517ade;color:white}img{display:block;width:100%;height:auto;border-radius:16px;margin-top:16px}p{color:#69778c}#stage.phone{max-width:390px}h1{font-size:24px}</style><main><h1>空广场的大主意 · A/B 对照</h1><select id="scene" aria-label="选择场景"></select><button id="a">A 原图</button><button id="b">B 差异图</button><button id="size">手机宽度</button><div id="stage"><img id="art" alt=""></div><p>点击 A/B 切换，或用键盘左右键。第 2 幅已采用短手臂修正版。当前为图片预览，尚未完成差异区域拼接验证。</p></main><script>const scenes=[{"title":"SD2-001 · 广场里的空椅子","a":"sd2-001-a.png","b":"sd2-001-b.png"},{"title":"SD2-002 · 气派过头的门牌","a":"sd2-002-a-pose-v2.png","b":"sd2-002-b.png"},{"title":"SD2-003 · 椅子也能搭火车","a":"sd2-003-a.png","b":"sd2-003-b.png"},{"title":"SD2-004 · 灯还没亮天先亮","a":"sd2-004-a.png","b":"sd2-004-b.png"},{"title":"SD2-005 · 两个完全不同的点子","a":"sd2-005-a.png","b":"sd2-005-b.png"},{"title":"SD2-006 · 推车不是搬家车","a":"sd2-006-a.png","b":"sd2-006-b.png"},{"title":"SD2-007 · 邀请卡的小尾巴","a":"sd2-007-a.png","b":"sd2-007-b.png"},{"title":"SD2-008 · 路线先转个方向","a":"sd2-008-a.png","b":"sd2-008-b.png"},{"title":"SD2-009 · 留给大家的位置","a":"sd2-009-a.png","b":"sd2-009-b.png"},{"title":"SD2-010 · 周末在这里见","a":"sd2-010-a.png","b":"sd2-010-b.png"}];const sel=document.getElementById('scene'),art=document.getElementById('art');let side='a';scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title;sel.append(o)});function show(){const s=scenes[Number(sel.value)];art.src=s[side];art.alt=s.title+' '+side.toUpperCase();['a','b'].forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===side)))}sel.onchange=show;['a','b'].forEach(k=>document.getElementById(k).onclick=()=>{side=k;show()});document.getElementById('size').onclick=()=>document.getElementById('stage').classList.toggle('phone');document.addEventListener('keydown',e=>{if(e.target===sel)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){side=e.key==='ArrowLeft'?'a':'b';show()}});show();</script></html>
